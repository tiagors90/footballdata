<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --turf: #1B4332;
    --turf-light: #2D6A4F;
    --chalk: #F7F5F0;
    --card: #FFFFFF;
    --ink: #1B1B1B;
    --ink-soft: #6B6A63;
    --line: #E1DDD0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--chalk);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding-bottom: 40px;
  }
  .scoreface { font-family: 'Oswald', sans-serif; font-variant-numeric: tabular-nums; }

  header.hero {
    background: var(--turf);
    background-image: linear-gradient(180deg, var(--turf) 0%, var(--turf-light) 100%);
    color: var(--chalk);
    padding: 28px 20px 22px;
    position: relative;
    overflow: hidden;
  }
  header.hero::after {
    content: "";
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 48px);
    pointer-events: none;
  }
  h1.title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    position: relative;
  }
  .subtitle { font-size: 13px; color: rgba(247,245,240,0.75); margin-top: 4px; position: relative; }
  .stat-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 16px 22px;
    margin-top: 18px;
    position: relative;
  }
  .stat-block .num {
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
  }
  .stat-block .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: rgba(247,245,240,0.7);
    margin-top: 3px;
  }

  .league-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .league-tabs::-webkit-scrollbar { display: none; }
  .pill {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.2px;
    border: 1.5px solid transparent;
    cursor: pointer;
    color: var(--ink);
    white-space: nowrap;
  }
  .pill.active { border-color: var(--ink); }

  main { padding: 0 16px; }
  section.panel { margin-bottom: 26px; }
  .panel-title {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    margin: 0 0 10px 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ---- Stat view toggle (segmented control) ---- */
  .view-toggle {
    display: flex;
    background: var(--line);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 10px;
    gap: 3px;
  }
  .view-toggle button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 7px 0;
    font-family: 'Oswald', sans-serif;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 500;
    color: var(--ink-soft);
    border-radius: 6px;
    cursor: pointer;
  }
  .view-toggle button.active {
    background: var(--card);
    color: var(--ink);
  }

  /* ---- Team table ---- */
  .team-table {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .team-row {
    display: grid;
    align-items: center;
    gap: 6px;
    padding: 10px 10px;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  .team-row:last-child { border-bottom: none; }
  .team-row.head {
    font-family: 'Oswald', sans-serif;
    font-size: 9.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
    padding-top: 8px; padding-bottom: 8px;
  }
  .rank { color: var(--ink-soft); font-family: 'Oswald', sans-serif; font-weight: 500; }
  .team-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-num { text-align: center; font-family: 'Oswald', sans-serif; }
  .gd-pos { color: #1D9E75; }
  .gd-neg { color: #D85A30; }

  /* ---- Match scoreboard rows ---- */
  .match-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .match-date {
    font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    width: 46px;
    flex-shrink: 0;
    line-height: 1.3;
  }
  .match-teams { flex: 1; min-width: 0; }
  .match-team-line {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    padding: 2px 0;
  }
  .match-team-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score-box {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: var(--chalk);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 7px;
    min-width: 22px;
    text-align: center;
  }
  .league-tag {
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 5px;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    flex-shrink: 0;
    align-self: flex-start;
  }
  .match-extra {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--line);
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .match-extra .extra-label {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-size: 9.5px;
    margin-right: 3px;
  }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 30px 10px;
  }
  .load-state { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 20px; }

  /* ---- Team detail modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(27,26,26,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .modal-overlay.hidden { display: none; }
  .modal-card {
    background: var(--card); border-radius: 14px; max-width: 380px; width: 100%;
    padding: 20px; max-height: 85vh; overflow-y: auto;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .modal-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 17px; padding-right: 10px; }
  .modal-close {
    background: none; border: none; font-size: 22px; color: var(--ink-soft);
    cursor: pointer; line-height: 1; padding: 2px 4px; flex-shrink: 0;
  }
  .modal-sub { font-size: 11px; color: var(--ink-soft); margin-bottom: 14px; }
  table.modal-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  table.modal-table th {
    font-family: 'Oswald', sans-serif; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.3px; color: var(--ink-soft); text-align: center; padding: 7px 4px;
    border-bottom: 1.5px solid var(--line);
  }
  table.modal-table td {
    padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--line);
    font-family: 'Oswald', sans-serif;
  }
  table.modal-table td:first-child, table.modal-table th:first-child {
    text-align: left; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12.5px;
  }
  table.modal-table tr:last-child td { border-bottom: none; }
</style>
</head>
<body>

<header class="hero">
  <h1 class="title">Football Tracker</h1>
  <div class="subtitle">Seven leagues, one scoreboard</div>
  <div class="stat-strip">
    <div class="stat-block"><div class="num scoreface" id="statMatches">–</div><div class="label">Matches</div></div>
    <div class="stat-block"><div class="num scoreface" id="statGoals">–</div><div class="label">Goals</div></div>
    <div class="stat-block"><div class="num scoreface" id="statAvg">–</div><div class="label">Goals / match</div></div>
    <div class="stat-block"><div class="num scoreface" id="statAvgCorners">–</div><div class="label">Corners / match</div></div>
    <div class="stat-block"><div class="num scoreface" id="statAvgCards">–</div><div class="label">Cards / match</div></div>
  </div>
</header>

<div class="league-tabs" id="leagueTabs"></div>

<main>
  <section class="panel">
    <div class="panel-title">Table</div>
    <div class="view-toggle" id="statToggle">
      <button data-view="goals" class="active">Goals</button>
      <button data-view="corners">Corners</button>
      <button data-view="cards">Cards</button>
    </div>
    <div class="team-table" id="teamTable">
      <div class="load-state">Loading…</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">Recent results</div>
    <div id="matchList">
      <div class="load-state">Loading…</div>
    </div>
  </section>

  <div style="text-align:center; padding: 10px 0 20px;">
    <a href="./info.html" style="font-size:12px; color:var(--ink-soft); text-decoration:underline;">About &amp; column legend</a>
  </div>
</main>

<script>
const SUPABASE_URL = "https://myjwctfetxuyqndbnodg.supabase.co";
const SUPABASE_KEY = "sb_publishable_w7rOiDHLvmeWG1kK2tILmA_XVAz7Ucc";

const headers = {
  apikey: SUPABASE_KEY,
  Authorization: "Bearer " + SUPABASE_KEY
};

async function sb(path) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, { headers });
  if (!res.ok) throw new Error("Supabase request failed: " + path + " (" + res.status + ")");
  return res.json();
}

let currentLeagueId = null;
let currentStatView = "goals"; // 'goals' | 'corners' | 'cards'
let leagues = [];
let currentTeams = [];

function fmt(n) {
  return (n === null || n === undefined) ? "–" : n;
}

document.getElementById("statToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-view]");
  if (!btn) return;
  currentStatView = btn.dataset.view;
  document.querySelectorAll("#statToggle button").forEach(b => b.classList.toggle("active", b === btn));
  renderTeamTable(currentTeams);
});

function renderTabs() {
  const el = document.getElementById("leagueTabs");
  el.innerHTML = "";
  leagues.forEach(lg => {
    const btn = document.createElement("div");
    btn.className = "pill" + (lg.id === currentLeagueId ? " active" : "");
    btn.style.background = lg.color;
    btn.textContent = lg.name;
    btn.onclick = () => { currentLeagueId = lg.id; renderTabs(); loadLeagueData(); };
    el.appendChild(btn);
  });
}

async function loadGlobalStats() {
  const summary = await sb("league_summary?select=matches_played,total_goals,total_corners,total_yellow,total_red");
  const matches = summary.reduce((a, r) => a + (r.matches_played || 0), 0);
  const goals = summary.reduce((a, r) => a + (r.total_goals || 0), 0);
  const corners = summary.reduce((a, r) => a + (r.total_corners || 0), 0);
  const cards = summary.reduce((a, r) => a + (r.total_yellow || 0) + (r.total_red || 0), 0);
  document.getElementById("statMatches").textContent = matches;
  document.getElementById("statGoals").textContent = goals;
  document.getElementById("statAvg").textContent = matches > 0 ? (goals / matches).toFixed(2) : "0.00";
  document.getElementById("statAvgCorners").textContent = matches > 0 ? (corners / matches).toFixed(2) : "0.00";
  document.getElementById("statAvgCards").textContent = matches > 0 ? (cards / matches).toFixed(2) : "0.00";
}

async function loadLeagueData() {
  const teamTable = document.getElementById("teamTable");
  const matchList = document.getElementById("matchList");
  teamTable.innerHTML = '<div class="load-state">Loading…</div>';
  matchList.innerHTML = '<div class="load-state">Loading…</div>';

  currentTeams = await sb(
    "team_summary?select=team_id,team_name,played,goals_for,goals_against,goal_diff," +
    "corners_for,corners_against,avg_corners_for,avg_corners_against," +
    "avg_corners_home,avg_corners_away," +
    "yellow_cards,red_cards,avg_cards_per_match" +
    "&league_id=eq." + currentLeagueId + "&order=goal_diff.desc,goals_for.desc"
  );
  renderTeamTable(currentTeams);

  const matches = await sb(
    "matches?select=match_date,home_goals,away_goals,home_corners,away_corners," +
    "home_yellow,home_red,away_yellow,away_red," +
    "league:leagues(name,color)," +
    "home_team:teams!matches_home_team_id_fkey(name)," +
    "away_team:teams!matches_away_team_id_fkey(name)" +
    "&league_id=eq." + currentLeagueId +
    "&order=match_date.desc&limit=15"
  );

  if (matches.length === 0) {
    matchList.innerHTML = '<div class="empty-state">No matches logged for this league yet.</div>';
  } else {
    matchList.innerHTML = matches.map(m => {
      const d = new Date(m.match_date + "T00:00:00");
      const dateStr = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
      const cornersLine = (m.home_corners !== null && m.away_corners !== null)
        ? `<span><span class="extra-label">Corners</span>${m.home_corners}–${m.away_corners}</span>`
        : "";
      const cardsLine = `<span><span class="extra-label">Cards</span>${m.home_yellow}Y ${m.home_red}R – ${m.away_yellow}Y ${m.away_red}R</span>`;
      return `<div class="match-card">
        <div class="match-date">${dateStr}</div>
        <div class="match-teams">
          <div class="match-team-line">
            <span class="match-team-name">${m.home_team.name}</span>
            <span class="score-box">${m.home_goals}</span>
          </div>
          <div class="match-team-line">
            <span class="match-team-name">${m.away_team.name}</span>
            <span class="score-box">${m.away_goals}</span>
          </div>
          <div class="match-extra">${cornersLine}${cardsLine}</div>
        </div>
      </div>`;
    }).join("");
  }
}

function renderTeamTable(teams) {
  const teamTable = document.getElementById("teamTable");
  if (teams.length === 0) {
    teamTable.innerHTML = '<div class="empty-state">No teams found for this league.</div>';
    return;
  }

  let headCols, rowFn;

  if (currentStatView === "goals") {
    headCols = ["P", "GF", "GA", "GD"];
    rowFn = t => {
      const gdClass = t.goal_diff > 0 ? "gd-pos" : (t.goal_diff < 0 ? "gd-neg" : "");
      const gdText = t.goal_diff > 0 ? "+" + t.goal_diff : t.goal_diff;
      return [fmt(t.played), fmt(t.goals_for), fmt(t.goals_against), `<span class="${gdClass}">${fmt(gdText)}</span>`];
    };
  } else if (currentStatView === "corners") {
    headCols = ["P", "CF", "CA", "AVG HOME", "AVG AWAY", "AVG TOTAL"];
    rowFn = t => [
      fmt(t.played), fmt(t.corners_for), fmt(t.corners_against),
      fmt(t.avg_corners_home), fmt(t.avg_corners_away), fmt(t.avg_corners_for)
    ];
  } else {
    headCols = ["P", "Y", "R", "Avg"];
    rowFn = t => [fmt(t.played), fmt(t.yellow_cards), fmt(t.red_cards), fmt(t.avg_cards_per_match)];
  }

  // rank column (24px) + team name (flexible) + N stat columns, evenly split
  const gridTemplate = `24px 1fr repeat(${headCols.length}, minmax(0, 1fr))`;

  let html = `<div class="team-row head" style="grid-template-columns:${gridTemplate}">
    <div>#</div><div>Team</div>${headCols.map(c => `<div style="text-align:center">${c}</div>`).join("")}
  </div>`;
  teams.forEach((t, i) => {
    const cols = rowFn(t);
    html += `<div class="team-row" style="grid-template-columns:${gridTemplate}">
      <div class="rank">${i + 1}</div>
      <div class="team-name" data-team-id="${t.team_id}" data-team-name="${t.team_name}"
           style="cursor:pointer; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:2px;">${t.team_name}</div>
      ${cols.map(c => `<div class="stat-num">${c}</div>`).join("")}
    </div>`;
  });
  teamTable.innerHTML = html;
}

// ---------- TEAM DETAIL MODAL ----------
document.getElementById("teamTable").addEventListener("click", (e) => {
  const el = e.target.closest(".team-name[data-team-id]");
  if (!el) return;
  openTeamModal(Number(el.dataset.teamId), el.dataset.teamName);
});

document.getElementById("modalCloseBtn").onclick = closeTeamModal;
document.getElementById("teamModalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "teamModalOverlay") closeTeamModal();
});

function closeTeamModal() {
  document.getElementById("teamModalOverlay").classList.add("hidden");
}

function avgOf(arr) {
  const vals = arr.filter(v => v !== null && v !== undefined);
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function fmtAvg(n) {
  return n === null ? "–" : n.toFixed(2);
}

async function openTeamModal(teamId, teamName) {
  document.getElementById("modalTeamName").textContent = teamName;
  document.getElementById("modalTeamSub").textContent = "";
  document.getElementById("modalContent").innerHTML = '<div class="load-state">Loading…</div>';
  document.getElementById("teamModalOverlay").classList.remove("hidden");

  let matches;
  try {
    matches = await sb(
      "matches?select=home_team_id,away_team_id,home_goals,away_goals,home_corners,away_corners," +
      "home_yellow,home_red,away_yellow,away_red" +
      `&league_id=eq.${currentLeagueId}` +
      `&or=(home_team_id.eq.${teamId},away_team_id.eq.${teamId})`
    );
  } catch (err) {
    document.getElementById("modalContent").innerHTML =
      `<div class="empty-state">Couldn't load this team's data.<br><span style="font-size:11px">${err.message}</span></div>`;
    console.error(err);
    return;
  }

  const homeM = matches.filter(m => m.home_team_id === teamId);
  const awayM = matches.filter(m => m.away_team_id === teamId);

  document.getElementById("modalTeamSub").textContent =
    `${matches.length} match${matches.length === 1 ? "" : "es"} played (${homeM.length} home, ${awayM.length} away)`;

  const rows = [
    ["Goals for", fmtAvg(avgOf(homeM.map(m => m.home_goals))), fmtAvg(avgOf(awayM.map(m => m.away_goals)))],
    ["Goals against", fmtAvg(avgOf(homeM.map(m => m.away_goals))), fmtAvg(avgOf(awayM.map(m => m.home_goals)))],
    ["Corners for", fmtAvg(avgOf(homeM.map(m => m.home_corners))), fmtAvg(avgOf(awayM.map(m => m.away_corners)))],
    ["Corners against", fmtAvg(avgOf(homeM.map(m => m.away_corners))), fmtAvg(avgOf(awayM.map(m => m.home_corners)))],
    ["Yellow cards", fmtAvg(avgOf(homeM.map(m => m.home_yellow))), fmtAvg(avgOf(awayM.map(m => m.away_yellow)))],
    ["Red cards", fmtAvg(avgOf(homeM.map(m => m.home_red))), fmtAvg(avgOf(awayM.map(m => m.away_red)))],
  ];

  document.getElementById("modalContent").innerHTML = `
    <table class="modal-table">
      <tr><th>Per match (avg)</th><th>Home</th><th>Away</th></tr>
      ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
    </table>
    <div style="font-size:10.5px; color:var(--ink-soft); margin-top:10px;">
      Corners/cards averages only count matches where that data has been entered.
    </div>
  `;
}


async function init() {
  try {
    leagues = await sb("leagues?select=id,name,color&order=id.asc");
    if (leagues.length === 0) {
      document.getElementById("leagueTabs").innerHTML = '<div class="empty-state">No leagues found. Did you run seed_leagues_teams.sql?</div>';
      return;
    }
    currentLeagueId = leagues[0].id;
    renderTabs();
    await loadGlobalStats();
    await loadLeagueData();
  } catch (err) {
    document.body.innerHTML = '<div class="empty-state" style="padding-top:60px">Could not reach the database.<br>' + err.message + '</div>';
    console.error(err);
  }
}

init();
</script>

<div class="modal-overlay hidden" id="teamModalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalTeamName">Team</div>
      <button class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-sub" id="modalTeamSub"></div>
    <div id="modalContent"><div class="load-state">Loading…</div></div>
  </div>
</div>

</body>
</html>
